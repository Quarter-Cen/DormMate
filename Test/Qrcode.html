<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Scrollbar</title>
    <style>
        /* Example container with scrollbars */
        .table-container {
            width: 100%;
            max-height: 500px; /* Adjust as needed */
            overflow-y: auto;
            display: block;
        }

        /* Webkit-based browsers (Chrome, Safari) */
        .table-container::-webkit-scrollbar {
            width: 12px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 8px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #38d1e9;
            border-radius: 8px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #1a75d2;
        }

        /* For Firefox */
        .table-container {
            scrollbar-width: thin;
            scrollbar-color: #38d1e9 #f1f1f1;
        }

        /* Sample table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            display: block;
        }

        table thead {
            background-color: #38d1e9;
            color: white;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        table tbody {
            display: block;
            max-height: 500px;
            overflow-y: auto;
        }

        table th,
        table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        table tbody tr {
            cursor: pointer;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        table tbody tr:hover {
            background-color: #f1f1f1;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Column 1</th>
                    <th>Column 2</th>
                    <th>Column 3</th>
                    <th>Column 4</th>
                    <th>Column 5</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                    <td>Data 3</td>
                    <td>Data 4</td>
                    <td>Data 5</td>
                </tr>
                <!-- Add more rows as needed -->
            </tbody>
        </table>
    </div>
</body>

</html>
